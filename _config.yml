# Public portfolio. Review notes and tooling are deliberately excluded from output.
title: blank
first_name: Shun-Hsiang
last_name: Hsu
lang: en
url: https://huhuman.github.io
baseurl: ""
description: >-
  Shun-Hsiang Hsu — machine learning research and engineering in multimodal AI,
  computer vision, synthetic data, and LLM evaluation. UIUC Ph.D. student, expected 2027.
serve_og_meta: true
serve_schema_org: true
og_image: https://huhuman.github.io/assets/img/prof_pic.jpg
keywords: Shun-Hsiang Hsu, machine learning, multimodal AI, computer vision, synthetic data, LLM evaluation
include: ["_pages", ".nojekyll"]
exclude:
  - docs
  - tests
  - bin
  - vendor
  - node_modules
  - .claude
  - .openai
  - .env
  - .env.*
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - requirements.txt
  - README.md
  - SECURITY.md
  - AGENTS.md
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - FAQ.md
  - INSTALL.md
  - LICENSE
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - purgecss.config.js
  - lighthouse_results
  - readme_preview
  - _pages/about_einstein.md
  - _pages/blog.md
  - _pages/books.md
  - _pages/dropdown.md
  - _pages/news.md
  - _pages/profiles.md
  - _pages/repositories.md
  - _pages/teaching.md
keep_files: [CNAME, .nojekyll]
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-get-json
  - jekyll/scholar
  - jekyll-sitemap
defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false
sass:
  style: compressed
scholar:
  last_name: [Hsu, H.]
  first_name: [Shun-Hsiang, S.-H.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
filtered_bibtex_keywords: [abstract, code, html, pdf, preview, selected, summary, contribution, website]
jekyll_get_json:
  - data: resume
    json: assets/json/resume.json
# Every copied static asset must be on this allowlist. It is not a secret store:
# source files and Git history of a public repository are still public.
public_assets:
  - /.nojekyll
  - /assets/js/portfolio.js
  - /assets/img/favicon.svg
  - /assets/img/prof_pic.jpg
  - /assets/img/publication_preview/synth-crack.png
  - /assets/img/publication_preview/defectsynth_overview.png
  - /assets/img/publication_preview/self_eval_agents.jpg
  - /assets/img/publication_preview/VSD_demo.gif
  - /assets/img/publication_preview/VL-Con.png
  - /assets/img/publication_preview/crack_segmentation.jpg
  - /assets/img/publication_preview/defect_inspection.jpg
  - /assets/img/publication_preview/steel_fatigue_crack.jpg
  - /assets/pdf/Shun_Hsiang_Hsu_Resume.pdf
  - /assets/json/resume.json
# These former template integrations are intentionally disabled.
external_sources: []
third_party_libraries:
  download: false
imagemagick:
  enabled: false
search_enabled: false
enable_math: false
enable_masonry: false
enable_medium_zoom: false
enable_progressbar: false
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
