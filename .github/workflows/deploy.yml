name: Build and deploy site

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate public artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BUNDLE_FROZEN: "true"
      JEKYLL_ENV: production
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for accidentally committed secrets
        run: python3 bin/check_secrets.py
      - name: Run validation tests
        run: python3 -m unittest discover -s tests
      - name: Set up Ruby and frozen dependency cache
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
          bundler: "2.6.9"
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build --disable-disk-cache
      - name: Check public files, local links, and content policies
        run: python3 bin/check_site.py _site
      - name: Check generated files for credential patterns
        run: python3 bin/check_secrets.py --site _site
      - name: Upload only the validated public artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site/
          if-no-files-found: error
          retention-days: 7
          # The checked artifact includes .nojekyll for branch-based Pages hosting.
          include-hidden-files: true

  deploy:
    name: Publish validated artifact to gh-pages
    needs: build
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      # The deploy action needs Git metadata; source code is not checked out here.
      - name: Check out the existing publication branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: gh-pages
          persist-credentials: false
      - name: Download this workflow run's validated artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site
      - name: Publish to the existing hosting branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          branch: gh-pages
          folder: _site
          clean: true
          force: false
